    <meta property="og:description" content="Store, view, and organize documents & identity cards without any internet connection" />

    <!-- PWA & Mobile Web App Meta Tags -->

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Typography with offline local/system fallbacks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Suppress known benign HMR WebSocket disconnect noise in AI Studio preview iframe
      (function() {
        const origErr = console.error;
        const origWarn = console.warn;
        const origLog = console.log;
        const origInfo = console.info;
        const isViteNoise = function(args) {
          return args && args.some && args.some(function(arg) {
            return typeof arg === 'string' && (arg.includes('[vite]') || arg.includes('failed to connect to websocket') || arg.includes('WebSocket'));
          });
        };
        console.error = function(...args) {
          if (isViteNoise(args)) return;
          origErr.apply(console, args);
        };
        console.warn = function(...args) {
          if (isViteNoise(args)) return;
          origWarn.apply(console, args);
        };
        console.log = function(...args) {
          if (isViteNoise(args)) return;
          origLog.apply(console, args);
        };
        console.info = function(...args) {
          if (isViteNoise(args)) return;
          origInfo.apply(console, args);
        };
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-['Plus_Jakarta_Sans',-apple-system,BlinkMacSystemFont,'Segoe_UI',Roboto,sans-serif]">

    <script type="module" src="/src/main.tsx"></script>
  </body>
